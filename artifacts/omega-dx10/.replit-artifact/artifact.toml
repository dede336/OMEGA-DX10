kind = "mobile"
previewPath = "/"
title = "OMEGA DX10"
version = "1.0.0"
id = "artifacts/omega-dx10"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 20040

[services.development]
run = "pnpm --filter @workspace/omega-dx10 run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/omega-dx10", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/omega-dx10", "run", "serve" ]

[services.env]
PORT = "20040"
BASE_PATH = "/"
